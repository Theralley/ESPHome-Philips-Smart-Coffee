# Power board (mainboard): NXP Kinetis MKE02Z64VLD4 over SWD.
# Probe: CMSIS-DAP, for example a Raspberry Pi Pico running debugprobe
# (GP2 = SWCLK, GP3 = SWDIO, GP1 = RESET).
# Machine unplugged from mains; board powered with 3.3 V on its +5V/GND test points.
# Not yet run on real hardware.

adapter driver cmsis-dap
source [find target/ke0x.cfg]

# ke0x.cfg sets 1000 kHz. Start slow, as the forum recommends.
adapter speed 400

# UI board ("Omnia UI Basic"): Infineon/Cypress CY8C4025AZI-S413 (PSoC 4000S) over SWD.
# Probe: CMSIS-DAP, for example a Raspberry Pi Pico running debugprobe
# (GP2 = SWCLK, GP3 = SWDIO, GP1 = RESET to the PSoC's XRES).
# Machine unplugged from mains; UI board disconnected from the mainboard and
# powered with 3.3 V. Not yet run on real hardware.

adapter driver cmsis-dap
source [find target/psoc4.cfg]
adapter speed 400

# psoc4.cfg uses SYSRESETREQ unless told otherwise. If the firmware keeps the
# SWD pins busy and "init" fails, wire XRES to the probe's RESET and uncomment:
# reset_config srst_only
